          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
          read: 30
          write: 10
        title: 开一本账
        type: http-request
        url: '{{#env.pc_base_url#}}/v1/scopes'
        variables: []
      height: 104
      id: pc_scope
      position:
        x: 600
        y: 300
      positionAbsolute:
        x: 600
        y: 300
