        x: 340
        y: 300
      positionAbsolute:
        x: 340
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-100
            key: ''
            type: text
            value: '{"title": "记仇客栈 · {{#prep.player_key#}}", "summary": "客栈掌柜的恩怨账本，玩家 {{#prep.player_key#}} 在此留下的每一笔账。", "idempotency_key": "grudge-inn-{{#prep.player_key#}}"}'
          type: json
        desc: 幂等创建玩家专属 scope；同名玩家重复调用会拿回同一个 scope
        headers: ''
        method: post
        params: ''
        retry_config:
