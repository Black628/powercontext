            type: text
            value: '{"scope_id": "{{#pick.scope_id#}}", "query": {{#prep.query_json#}},
              "max_bytes": 3000}'
          type: json
        desc: 让 PowerContext 按本回合的话检索这位玩家的旧记忆块
        headers: ''
