    nodes:
    - data:
        desc: 只有玩家ID，没有密码：换会话、隔天再来，报同一个ID就是同一位客人。
        selected: false
        title: 报上名号
        type: start
        variables:
        - label: 玩家ID（翻旧账靠它记住你，留空则叫 guest）
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: player_id
      height: 110
      id: start
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json
          import re


          def main(player_id: str, user_id: str, utterance: str) -> dict:
              raw = (player_id or "").strip()
              if not raw:
                  # 没报名号时退回 Dify 的会话身份，保证同一位体验者跨会话共用一本账。
                  user = (user_id or "").strip()
                  raw = "dx-" + user[:8] if user else "guest"
              # 只保留字母数字、汉字与下划线/连字符，避免 scope 标识里出现奇怪字符
              key = re.sub(r"[^0-9A-Za-z_\u4e00-\u9fff-]", "-", raw)[:48] or "guest"
              said = (utterance or "").strip() or "（客人沉默不语）"
              return {
                  "player_key": key,
                  "query_json": json.dumps(said),
                  "reason_json": json.dumps("玩家原话：" + said, ensure_ascii=False),
              }
        code_language: python3
        desc: 规范化玩家ID（留空则用 Dify 会话用户兜底），并把这一回合的话转成可直接拼进 JSON 的安全字面量
        outputs:
          player_key:
            children: null
            type: string
          query_json:
            children: null
            type: string
          reason_json:
            children: null
            type: string
        selected: false
        title: 身份与话术整理
        type: code
        variables:
        - value_selector:
          - start
          - player_id
          value_type: string
          variable: player_id
        - value_selector:
          - sys
          - user_id
          value_type: string
          variable: user_id
        - value_selector:
          - sys
          - query
          value_type: string
          variable: utterance
      height: 116
      id: prep
