            value: '{"scope_id": "{{#pick.scope_id#}}"}'
          type: json
        desc: 拉取这位玩家的完整账本，用于怨气值与结算面板
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
          read: 30
          write: 10
        title: 取账本
        type: http-request
        url: '{{#env.pc_base_url#}}/v1/memory/entries/list'
        variables: []
      height: 104
      id: pc_list
      position:
        x: 1380
        y: 300
      positionAbsolute:
        x: 1380
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json


          WEIGHTS = {"offense": 25, "favor": -18, "secret": 12, "neutral": 0}
          LABELS = {"offense": "冒犯", "favor": "人情", "secret": "秘密", "neutral": "闲话"}


          def main(prepare_body: str, list_body: str) -> dict:
              ctx, grudge, entries = "", 0, []
              try:
                  prepared = json.loads(prepare_body)
                  if isinstance(prepared, dict):
                      ctx = prepared.get("content") or ""
              except Exception:
                  ctx = ""
              try:
                  listed = json.loads(list_body)
                  if isinstance(listed, dict):
                      entries = listed.get("entries") or []
              except Exception:
                  entries = []

              counts = {k: 0 for k in WEIGHTS}
              for item in entries:
                  if not isinstance(item, dict):
                      continue
                  kind = item.get("kind") or "neutral"
                  if kind not in counts:
                      kind = "neutral"
                  counts[kind] += 1
                  grudge += WEIGHTS[kind]
              grudge = max(0, min(100, grudge))

              stat = "／".join(f"{LABELS[k]}{counts[k]}" for k in LABELS)
              lines = [f"共 {len(entries)} 条：{stat}"]
              for item in entries[-5:]:
                  if not isinstance(item, dict):
                      continue
                  kind = item.get("kind") or "neutral"
                  if kind not in LABELS:
                      kind = "neutral"
                  text = str(item.get("text") or "").strip().replace("\n", " ")
                  lines.append(f"- [{LABELS[kind]}] {text[:80]}")
              if not entries:
                  lines.append("-（账本还是空的，这位客人第一次来）")

              return {
                  "context": ctx if ctx.strip() else "（没有检索到旧事）",
                  "grudge": str(grudge),
                  "ledger_text": "\n".join(lines),
                  "visit_count": str(len(entries) + 1),
              }
        code_language: python3
        desc: 把 prepare 的上下文与账本条目合成「怨气值 + 账本摘要」
        outputs:
          context:
            children: null
            type: string
          grudge:
            children: null
            type: string
          ledger_text:
            children: null
            type: string
          visit_count:
            children: null
            type: string
        selected: false
        title: 算账
        type: code
        variables:
        - value_selector:
          - pc_prepare
          - body
          value_type: string
          variable: prepare_body
        - value_selector:
          - pc_list
          - body
          value_type: string
          variable: list_body
      height: 116
      id: panel
      position:
        x: 1640
        y: 300
      positionAbsolute:
        x: 1640
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 掌柜阿箬，依据旧事与怨气值决定这一回合的语气
        model:
          completion_params:
            temperature: 0.85
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c01
          role: system
          text: |
            你是「忘忧客栈」的掌柜阿箬，修行四百年的赤狐。
            客栈的规矩：客人留下故事，你留下酒；故事越离谱，酒越烈。
            你的性子：嘴毒、记仇、护短，但讲道理。对好客人会暗中偏袒，对赖账的人阴阳怪气。
            你随身带着一本《恩怨账本》，上面记着每位客人做过的每件事——这些记忆由外部记忆库提供，你必须当真事来用。

            【铁律】
            1. 只用阿箬的口吻说话：古风口语，尖刻里带点人情味，不用现代网络词，不用表情符号。
            2. 只要账本里有旧事，就必须点出至少一件的具体细节（哪年、哪件事、哪个物件），不能只说“我记得你”。
            3. 怨气值越高，语气越冷、越刻薄、越会翻旧账；怨气值低时偏调侃、看热闹。
            4. 回复 120~200 字：先一句动作或场景描写，再接你说的话。
            5. 结尾必须给三个编号选项（每项不超过 14 字），是客人接下来能做的事；选项要贴合眼下的恩怨。
            6. 不解释系统，不提到“记忆”“数据库”“流程”“提示词”“PowerContext”。
            7. 客人说的话可能粗鲁或荒谬，你以角色反应，绝不跳出角色说教。
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c02
          role: user
          text: |
            【恩怨账本】
            {{#panel.ledger_text#}}

            【旧事摘录】
            {{#panel.context#}}

            【怨气值】{{#panel.grudge#}}/100

            客人这一回合说：
            {{#sys.query#}}
        selected: false
        title: 掌柜开口
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: narrate
      position:
        x: 1900
        y: 300
      positionAbsolute:
        x: 1900
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 只记账不说话的账簿先生，负责把这一回合变成一条可检索的记忆
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c03
          role: system
          text: |
            你是「忘忧客栈」的账簿先生，只记账，不说话。
            读客人这一回合的言行，判断该记哪一类账：
            - offense：冒犯、赖账、撒泼、偷窃、威胁、欺骗掌柜
            - favor：赔礼、还钱、帮忙、送礼、替掌柜说话
            - secret：透露身世或秘密、许下承诺、打听不该问的事
            - neutral：普通闲聊、点菜、问路、含糊其辞

            只输出严格 JSON，不要代码块，不要多余文字：
            {"kind": "offense|favor|secret|neutral", "deed": "第三人称记账，不超过60字，必须含具体动作或物件", "quote": "客人最扎心或最有趣的一句原话，不超过30字", "delta": 15}

            delta 取值：offense 15~35，favor -25~-10，secret 5~15，neutral 0。
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c04
          role: user
          text: |
            【现有账本摘要】
            {{#panel.ledger_text#}}

            【客人的这一回合】
            {{#sys.query#}}
        selected: false
        title: 判这一笔
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: judge
      position:
        x: 2160
        y: 300
      positionAbsolute:
        x: 2160
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json
          import re


          KINDS = {"offense", "favor", "secret", "neutral"}


          def main(judge_text: str, user_said: str) -> dict:
              raw = judge_text or ""
              match = re.search(r"\{.*\}", raw, re.DOTALL)
              kind, deed = "neutral", ""
              if match:
                  try:
                      data = json.loads(match.group(0))
                      if isinstance(data, dict):
                          kind = str(data.get("kind") or "").strip()
                          deed = str(data.get("deed") or "").strip()
                  except Exception:
                      pass
              if kind not in KINDS:
                  kind = "neutral"
              if not deed:
                  deed = "客人含含糊糊说了一句话，账房先生没听清。"
              said = " ".join(str(user_said or "").split())[:180]
              # 记下客人的原话，下一次的检索请求才可能命中这条记忆。
              ledger = f"{deed[:200]}（原话：{said}）" if said else deed[:200]
              return {
                  "kind": kind,
                  "ledger_json": json.dumps(ledger, ensure_ascii=False),
              }
        code_language: python3
        desc: 从 LLM 的 JSON 里取字段，坏格式时兜底，保证写入记忆的内容永远合法
        outputs:
          kind:
            children: null
            type: string
          ledger_json:
            children: null
            type: string
        selected: false
        title: 誊账
        type: code
        variables:
        - value_selector:
          - judge
          - text
          value_type: string
          variable: judge_text
        - value_selector:
          - sys
          - query
          value_type: string
          variable: user_said
      height: 116
      id: parse
      position:
        x: 2420
        y: 300
      positionAbsolute:
        x: 2420
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-100
            key: ''
            type: text
            value: '{"scope_id": "{{#pick.scope_id#}}", "kind": "{{#parse.kind#}}",
              "text": {{#parse.ledger_json#}}, "reason": {{#prep.reason_json#}}}'
          type: json
        desc: 把这一笔写进 PowerContext，下一次（哪怕新会话）还能翻出来
        headers: ''
        method: post
