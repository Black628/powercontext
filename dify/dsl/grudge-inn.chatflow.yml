app:
  description: 忘忧客栈里，狐狸掌柜阿箬会把你做过的每件事记进恩怨账本；换个会话再来，她照样翻旧账。
  icon: 🦊
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 记仇客栈 · 会翻旧账的狐狸掌柜
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext HTTP 服务地址。Dify 跑在 Docker 里时改成 http://host.docker.internal:8000
    id: 2c7c9f0e-3a51-4f0e-9d3a-6f1a1f3f7a10
    name: pc_base_url
    selector:
    - env
    - pc_base_url
    value: http://127.0.0.1:8000
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 50
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |
      🌙 夜雨初歇，忘忧客栈的灯笼晃了三下。

      柜台后，一只赤狐捏着毛笔抬眼：“生面孔啊。先报个名号——报得清楚，我记你一笔；报得不清楚，我也记你一笔。”

      说完，她把一本边角卷起的册子往桌上一拍。

      🦊 玩法：在「玩家ID」里填一个名字（例如 `shen`），然后在对话里自由作恶、赔罪或闲聊。你做的每件事都会被记进恩怨账本；换个会话、隔天再来，报同一个ID，阿箬会跟你一笔一笔地算。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我把碗摔了，钱也不赔，你能拿我怎样？
    - 上次的事是我不对，我赔你三坛酒。
    - 掌柜的，你这客栈开多少年了？可有旧相好？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
