      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json


          def main(scope_body: str) -> dict:
              scope_id = ""
              try:
                  data = json.loads(scope_body)
                  if isinstance(data, dict):
                      scope_id = str(data.get("scope_id") or "")
              except Exception:
                  scope_id = ""
              return {"scope_id": scope_id}
        code_language: python3
        desc: 从开账响应里取出服务端签发的 scope_id，供后续记忆节点复用
