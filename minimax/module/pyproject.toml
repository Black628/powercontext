[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sddcontext"
version = "1.0.0"
description = "SDD 上下文管理模块：seekdb 检索 + PowerContext 状态复用 + MiniMax 代码修改"
requires-python = ">=3.9"
dependencies = ["PyMySQL>=1.0"]

[project.scripts]
sddcontext = "sddcontext.cli:main"

[tool.setuptools]
packages = ["sddcontext"]
